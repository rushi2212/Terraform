services:

  backend:
    build: ./backend
    container_name: flask-backend

    ports:
      - "5000:5000"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: express-frontend

    ports:
      - "3000:3000"
      
    depends_on:
      backend:
        condition: service_healthy